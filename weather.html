<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg:      #0f0f0f;
      --color-surface: #1a1a1a;
      --color-border:  #2a2a2a;
      --color-text:    #e8e4dc;
      --color-muted:   #888;
      --color-accent:  #c9a96e;
      --font-display:  'Playfair Display', Georgia, serif;
      --font-body:     'DM Sans', sans-serif;
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
 
    /* Back link */
    .back-link {
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--color-accent); }
 
    /* Card */
    .card {
      width: 100%;
      max-width: 480px;
      animation: fadeUp 0.6s ease both;
    }
 
    .card-header {
      margin-bottom: 2.5rem;
    }
 
    .card-header p {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.4rem;
    }
 
    .card-header h1 {
      font-family: var(--font-display);
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.1;
    }
 
    /* Search */
    .search-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
 
    .search-row input {
      flex: 1;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
 
    .search-row input::placeholder { color: var(--color-muted); }
    .search-row input:focus { border-color: var(--color-accent); }
 
    .search-row button {
      background: var(--color-accent);
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1.5rem;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }
 
    .search-row button:hover { opacity: 0.85; transform: translateY(-1px); }
    .search-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
 
    /* Error */
    .error {
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.25);
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      font-size: 0.875rem;
      color: #ff8080;
      margin-bottom: 1.5rem;
      display: none;
    }
    .error.visible { display: block; }
 
    /* Weather result */
    .weather-result {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 2rem;
      display: none;
      animation: fadeUp 0.4s ease both;
    }
    .weather-result.visible { display: block; }
 
    .weather-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }
 
    .weather-location h2 {
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.1;
    }
 
    .weather-location p {
      font-size: 0.8rem;
      color: var(--color-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }
 
    .weather-icon {
      font-size: 3.5rem;
      line-height: 1;
    }
 
    .weather-temp {
      font-family: var(--font-display);
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }
 
    .weather-temp sup {
      font-size: 1.5rem;
      vertical-align: super;
    }
 
    .weather-desc {
      font-size: 0.95rem;
      color: var(--color-muted);
      text-transform: capitalize;
      margin-bottom: 2rem;
    }
 
    .weather-divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin-bottom: 1.5rem;
    }
 
    .weather-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
 
    .stat {
      text-align: center;
    }
 
    .stat-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.35rem;
    }
 
    .stat-value {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--color-text);
    }
 
    /* Loading spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(201, 169, 110, 0.3);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .spinner.visible { display: block; }
 
    /* API key notice */
    .api-notice {
      background: rgba(201, 169, 110, 0.07);
      border: 1px solid rgba(201, 169, 110, 0.2);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      font-size: 0.8rem;
      color: var(--color-muted);
      line-height: 1.6;
      margin-top: 1.5rem;
    }
 
    .api-notice a {
      color: var(--color-accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
 
    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
 
    @media (max-width: 520px) {
      .weather-temp { font-size: 3.5rem; }
      .weather-stats { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    }
  </style>
</head>
<body>
 
  <a href="index.html" class="back-link">← Portfolio</a>
 
  <div class="card">
    <div class="card-header">
      <p>Project 01</p>
      <h1>Weather App</h1>
    </div>
 
    <div class="search-row">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter a city name..."
        autocomplete="off"
      />
      <button id="searchBtn" onclick="getWeather()">Search</button>
    </div>
 
    <div class="error" id="errorBox"></div>
    <div class="spinner" id="spinner"></div>
 
    <div class="weather-result" id="weatherResult">
      <div class="weather-top">
        <div class="weather-location">
          <h2 id="cityName"></h2>
          <p id="countryName"></p>
        </div>
        <div class="weather-icon" id="weatherIcon"></div>
      </div>
 
      <div class="weather-temp">
        <span id="tempValue"></span><sup>°F</sup>
      </div>
      <p class="weather-desc" id="weatherDesc"></p>
 
      <hr class="weather-divider" />
 
      <div class="weather-stats">
        <div class="stat">
          <div class="stat-label">Feels Like</div>
          <div class="stat-value" id="feelsLike">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Humidity</div>
          <div class="stat-value" id="humidity">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Wind</div>
          <div class="stat-value" id="wind">—</div>
        </div>
      </div>
    </div>
 
    <div class="api-notice">
      🔑 This app uses the <a href="https://openweathermap.org/api" target="_blank">OpenWeatherMap API</a>.
    </div>
  </div>
 
  <script>
    // ⬇️ Paste your free API key here
    const API_KEY = '9155ec2f1a910def35c08198a75ca984';
 
    const weatherIcons = {
      Thunderstorm: '⛈️',
      Drizzle:      '🌦️',
      Rain:         '🌧️',
      Snow:         '❄️',
      Mist:         '🌫️',
      Smoke:        '🌫️',
      Haze:         '🌫️',
      Fog:          '🌫️',
      Clear:        '☀️',
      Clouds:       '☁️',
    };
 
    // Allow pressing Enter to search
    document.getElementById('cityInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') getWeather();
    });
 
    async function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;
 
      // Reset UI
      setError('');
      document.getElementById('weatherResult').classList.remove('visible');
      document.getElementById('spinner').classList.add('visible');
      document.getElementById('searchBtn').disabled = true;
 
      try {
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=imperial`;
        const res = await fetch(url);
        const data = await res.json();
 
        if (!res.ok) {
          throw new Error(data.message || 'City not found');
        }
 
        displayWeather(data);
 
      } catch (err) {
        setError(err.message === 'City not found'
          ? `Couldn't find "${city}". Check the spelling and try again.`
          : `Something went wrong: ${err.message}`
        );
      } finally {
        document.getElementById('spinner').classList.remove('visible');
        document.getElementById('searchBtn').disabled = false;
      }
    }
 
    function displayWeather(data) {
      const mainCondition = data.weather[0].main;
 
      document.getElementById('cityName').textContent     = data.name;
      document.getElementById('countryName').textContent  = data.sys.country;
      document.getElementById('weatherIcon').textContent  = weatherIcons[mainCondition] || '🌡️';
      document.getElementById('tempValue').textContent    = Math.round(data.main.temp);
      document.getElementById('weatherDesc').textContent  = data.weather[0].description;
      document.getElementById('feelsLike').textContent    = Math.round(data.main.feels_like) + '°F';
      document.getElementById('humidity').textContent     = data.main.humidity + '%';
      document.getElementById('wind').textContent         = Math.round(data.wind.speed) + ' mph';
 
      document.getElementById('weatherResult').classList.add('visible');
    }
 
    function setError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.toggle('visible', !!msg);
    }
  </script>
 
</body>
</html>
